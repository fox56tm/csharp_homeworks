name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: |
          for sln in hw*/Hw*.slnx; do
            dotnet build "$sln"
            dotnet test "$sln" --no-build
          done
